name: Project

# Every generated artifact has one writer, and it is this job. shipyard's project
# action runs the projectors and commits the result to the branch, so a committed
# artifact matches its source at all times and the diff a reviewer approves is the
# change that lands.
#
# The build runs first, and has to: `dist/` is committed (bin/tack runs it) and is
# projected by this job rather than rebuilt by hand, and gen-cli-manifest
# interrogates the built CLI to record its grammar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The default pull_request checkout leaves a merge commit in detached
          # HEAD, and there is no branch there to push a projection to.
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: chris-peterson/shipyard/actions/project@v2
